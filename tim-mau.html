<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tìm mẫu bánh – Anela Pastry</title>
  <meta name="description" content="Tìm mẫu bánh theo tên, vị, loại bánh và ngân sách tại Anela Pastry.">
  <link rel="icon" href="images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="search">
  <div id="site-header"></div>

  <main>
    <div class="page-hero">
      <div class="wrap">
        <div class="crumbs">Tìm mẫu</div>
        <h1>Tìm theo <span class="grad">số hoặc từ khoá</span></h1>
        <form id="search-form" class="tim-o" role="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <label class="sr-only" for="q">Tìm mẫu bánh</label>
          <input id="q" name="q" type="search" placeholder="Số mẫu, tên, vị, dịp: 12, dâu, hoa, sinh nhật…" autocomplete="off">
        </form>
        <div class="tim-goi" id="tim-goi" aria-label="Gợi ý tìm nhanh"></div>
      </div>
    </div>

    <section class="page-body">
      <div class="wrap">
        <p class="tim-dem" id="result-count" aria-live="polite"></p>
        <div class="grid" id="search-grid"></div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
