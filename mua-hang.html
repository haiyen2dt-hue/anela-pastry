<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mua hàng – Anela Pastry</title>
  <meta name="description" content="Giỏ hàng và đặt bánh online tại Anela Pastry Hà Nội.">
  <link rel="icon" href="images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="checkout">
  <div id="site-header"></div>

  <main>
    <div class="page-hero">
      <div class="wrap">
        <div class="crumbs"><a href="index.html">Trang chủ</a> / Mua hàng</div>
        <h1>Giỏ bánh & <span class="grad">đặt hàng</span></h1>
        <p>Kiểm tra giỏ bánh, điền thông tin nhận bánh và gửi đơn cho Anela.</p>
      </div>
    </div>

    <section class="page-body">
      <div class="wrap">
        <div id="order-success" hidden></div>

        <div class="checkout" id="checkout-shell">
          <div>
            <div class="panel">
              <h2>Giỏ bánh của bạn</h2>
              <div id="cart-list"></div>
            </div>
            <div class="panel">
              <h2>Tóm tắt</h2>
              <div class="summary-row"><span>Tiền bánh</span><span id="sum-sub">0đ</span></div>
              <div class="summary-row"><span>Phí ship</span><span id="sum-ship">Nhận tại tiệm</span></div>
              <div class="summary-row total"><span>Tổng cộng</span><span id="sum-total">0đ</span></div>
              <div class="summary-row coc"><span id="sum-deposit-label">Cọc trước</span><span id="sum-deposit">0đ</span></div>
              <div class="summary-row"><span>Còn lại khi nhận bánh</span><span id="sum-rest">0đ</span></div>
              <p id="sum-note" style="margin:8px 0 0;font-size:14px;color:var(--muted)"></p>
            </div>
          </div>

          <form class="panel" id="checkout-form" novalidate>
            <h2>Thông tin đặt bánh</h2>
            <div class="row-2">
              <div class="field">
                <label for="f-name">Họ tên <span class="req">*</span></label>
                <input id="f-name" class="input" name="fullname" required autocomplete="name">
              </div>
              <div class="field">
                <label for="f-phone">Số điện thoại <span class="req">*</span></label>
                <input id="f-phone" class="input" name="phone" type="tel" required autocomplete="tel" placeholder="09xx xxx xxx">
              </div>
            </div>

            <div class="field">
              <span class="field-label">Hình thức nhận bánh</span>
              <div class="choice-group">
                <label class="choice"><input type="radio" name="delivery" value="pickup" checked><span>Nhận tại tiệm</span></label>
                <label class="choice"><input type="radio" name="delivery" value="ship"><span>Giao tận nơi (Hà Nội)</span></label>
              </div>
              <p class="hint" id="pickup-hint" style="margin:6px 0 0"></p>
            </div>

            <div class="field" id="address-field" hidden>
              <label for="f-address">Địa chỉ giao bánh <span class="req">*</span></label>
              <input id="f-address" class="input" name="address" autocomplete="street-address" placeholder="Số nhà, ngõ, đường, toà nhà">
            </div>
            <div class="field" id="distance-field" hidden></div>

            <div class="row-2">
              <div class="field">
                <label for="f-date">Ngày nhận <span class="req">*</span></label>
                <input id="f-date" class="input" name="date" type="date" required>
              </div>
              <div class="field">
                <label for="f-slot">Khung giờ</label>
                <select id="f-slot" class="input" name="slot"></select>
              </div>
            </div>
            <p class="hint" id="lead-hint" style="margin:-8px 0 14px"></p>

            <div class="field">
              <span class="field-label">Thanh toán phần còn lại</span>
              <p class="hint" id="deposit-hint" style="margin:0 0 4px"></p>
              <div class="choice-group">
                <label class="choice"><input type="radio" name="payment" value="bank" checked><span>Chuyển khoản</span></label>
                <label class="choice"><input type="radio" name="payment" value="cash"><span>Tiền mặt khi nhận</span></label>
              </div>
            </div>
            <div id="bank-info"></div>

            <div class="field">
              <label for="f-notes">Ghi chú thêm</label>
              <textarea id="f-notes" class="input" name="notes" placeholder="Màu sắc, trang trí, số nến…"></textarea>
            </div>

            <button class="btn btn-primary btn-lg btn-block" id="submit-order" type="submit">Đặt bánh</button>
          </form>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="js/data.js"></script>
  <script src="js/phuong-hanoi.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
